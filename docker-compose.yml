# docker-compose.yml — Lightweight Standalone Orchestration for Jobryt AI Agent
# Runs Web Dashboard, Autonomous Engine & Background Cron Scheduler (port 3000)
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - SCRIPTS_DIR=/app/scripts
      - PROMPTS_DIR=/app/prompts
    env_file:
      - ${ENV_FILE:-.env}
    deploy:
      resources:
        limits:
          memory: 1024M
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ./public:/app/public
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./server.js:/app/server.js
      - ${ENV_FILE:-.env}:/app/.env
