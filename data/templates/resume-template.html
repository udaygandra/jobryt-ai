<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #1f2937; margin: 0; padding: 40px; background: #ffffff; }
        h1 { font-size: 24px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 5px; color: #111827; }
        .contact-info { font-size: 13px; color: #4b5563; margin-bottom: 24px; }
        h2 { font-size: 16px; text-transform: uppercase; letter-spacing: 0.5px; color: #111827; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; margin-top: 24px; }
        .job-title { font-weight: 600; font-size: 15px; color: #111827; margin-bottom: 2px; }
        .company { font-size: 13px; color: #4b5563; margin-bottom: 8px; }
        ul { margin-top: 4px; padding-left: 18px; }
        li { margin-bottom: 6px; font-size: 13.5px; color: #1f2937; }
        .skills-list { font-size: 13.5px; color: #1f2937; margin-top: 8px; }
    </style>
</head>
<body>

    <h1>{{NAME}}</h1>
    <div class="contact-info">
        {{LOCATION}} | {{TARGET_TITLES}}
    </div>

    <h2>Tailored Summary / Cover Letter</h2>
    <p style="font-size: 14px;">{{COVER_LETTER}}</p>

    <h2>Experience</h2>
    <div class="job">
        <div class="job-title">{{RELEVANT_ROLE}}</div>
        <div class="company">{{RELEVANT_COMPANY}} | {{RELEVANT_DATES}}</div>
        <ul>
            {{BULLETS_HTML}}
        </ul>
    </div>

    <h2>Skills</h2>
    <div class="skills-list">
        {{SKILLS}}
    </div>

</body>
</html>
